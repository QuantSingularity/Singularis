[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singularis"
version = "0.1.0"
description = "Self-improving agent research framework: agents that evaluate, diagnose, and rewrite their own code under a frozen evaluator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QuantSingularity Research Institute" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
singularis = "backend.cli:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["ai_models*", "backend*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP037", "UP006", "UP007", "UP035", "RUF012", "B011", "SIM117", "B904"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"frontend/test/*" = ["E402"]
"code/**/tests/*" = ["E402", "B018"]
"code/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
files = ["code/backend", "code/ai_models"]
exclude = ["tests/"]

[tool.coverage.run]
source = ["code/backend", "code/ai_models"]
omit = ["*/tests/*"]
