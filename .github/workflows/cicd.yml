# Singularis CI/CD: every GitHub Actions job in one workflow.
#
#   Continuous integration (every push and pull request)
#     static        Python syntax, shell scripts, Dockerfile, compose file, workflow syntax, docs rules
#     test          Full test suite on Python 3.10 to 3.13 with coverage
#     frontend      Dashboard tests (jsdom plus the real server)
#     browser       Dashboard in real Chromium (informational)
#     smoke         Scripted end-to-end run of the CLI: eval, evolve, verify, report, serve
#     proxy-policy  Egress allowlist tested against a real squid
#     docker-stack  Build the container stack and verify its isolation guarantees
#     build         Wheel and sdist, installed into a clean environment
#     codeql        Code scanning (informational)
#     ci-passed     Single required check for branch protection
#
#   Scheduled and manual
#     audit         Dependency vulnerability audit (weekly and manual)
#     live-baseline Small real-model baseline (manual, uses the ANTHROPIC_API_KEY secret)
#
#   Delivery (tags named v*)
#     release        GitHub release with the built distributions
#     docker-publish Container image pushed to GitHub Container Registry
#
# Setup: add the ANTHROPIC_API_KEY secret only if you want live-baseline. Protect the "live-model"
# environment with required reviewers if you want an approval step before any paid run.

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      live_baseline:
        description: Run a small real-model baseline (uses the ANTHROPIC_API_KEY secret and costs money)
        type: boolean
        default: false
      live_model:
        description: Model spec for the live baseline
        type: string
        default: anthropic:claude-sonnet-5-5
      live_tasks:
        description: Comma separated task ids for the live baseline
        type: string
        default: fizzbuzz,median_bug,roman

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SINGULARIS_LOG_DIR: /tmp/singularis-logs

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Python syntax and undefined names
        run: |
          python -m pip install ruff
          python -m compileall -q code scripts frontend/test
          ruff check --select E9,F63,F7,F82,F401,F811,F841 --output-format=github code scripts frontend/test

      - name: Shell scripts
        # SC2155 (declare and assign separately) is a style warning in the two Docker scripts, not a bug.
        run: shellcheck -e SC2155 scripts/*.sh

      - name: Dockerfile
        run: |
          curl -sSfL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x hadolint
          ./hadolint infrastructure/Dockerfile

      - name: Compose file
        env:
          ANTHROPIC_API_KEY: ""
          LOCAL_UID: "1000"
          LOCAL_GID: "1000"
        run: docker compose -f infrastructure/docker-compose.yml config --quiet

      - name: Workflow syntax
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color

      - name: Documentation rules (tables, links, no em dashes, no emoji)
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys


          def cells(line):
              out, buf, tick = [], "", False
              for ch in line.strip().strip("|"):
                  if ch == "`":
                      tick = not tick
                  if ch == "|" and not tick:
                      out.append(buf)
                      buf = ""
                  else:
                      buf += ch
              out.append(buf)
              return out


          problems = []
          docs = [p for p in pathlib.Path(".").rglob("*.md") if "node_modules" not in p.parts and ".git" not in p.parts]
          for path in docs:
              text = path.read_text()
              lines = text.splitlines()
              if sum(1 for line in lines if line.startswith("```")) % 2:
                  problems.append(f"{path}: unbalanced code fence")
              in_fence = False
              i = 0
              while i < len(lines):
                  if lines[i].startswith("```"):
                      in_fence = not in_fence
                  if not in_fence and lines[i].startswith("|"):
                      j = i
                      while j < len(lines) and lines[j].startswith("|"):
                          j += 1
                      block = lines[i:j]
                      width = len(cells(block[0]))
                      if len(block) < 3 or not re.fullmatch(r"\|(\s*:?-{3,}:?\s*\|)+", block[1].strip()):
                          problems.append(f"{path}:{i + 1}: table needs a header and a separator row")
                      for k, row in enumerate(block):
                          if len(cells(row)) != width:
                              problems.append(f"{path}:{i + k + 1}: expected {width} cells")
                      if i and lines[i - 1].strip():
                          problems.append(f"{path}:{i + 1}: table must follow a blank line")
                      i = j
                      continue
                  i += 1
              for m in re.finditer(r"\[[^\]]+\]\(([^)#]+)(#[^)]*)?\)", text):
                  target = m.group(1)
                  if not target.startswith(("http://", "https://", "mailto:")) and not (path.parent / target).exists():
                      problems.append(f"{path}: broken link {target}")

          emoji = re.compile("[\U0001F300-\U0001FAFF\u2600-\u27BF\u2B00-\u2BFF\uFE0F\u200D]")
          skip = {".zip", ".png", ".db", ".pyc", ".whl", ".gz"}
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or "node_modules" in path.parts or path.suffix in skip:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if "\u2014" in text or "\u2013" in text:
                  problems.append(f"{path}: contains an em dash or en dash")
              if emoji.search(text):
                  problems.append(f"{path}: contains an emoji")

          print(f"checked {len(docs)} markdown files")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          PY

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]" pytest-cov

      - name: Validate the benchmark (starters fail, references pass)
        run: singularis validate-suite

      - name: Run the tests
        run: python -m pytest --cov=ai_models --cov=backend --cov-report=term --cov-report=xml --junitxml=junit.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the package
        run: python -m pip install -e ".[dev]"

      - name: Install the dashboard test dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Render, hostile input and error handling checks
        run: node test/render.js
        working-directory: frontend

      - name: Live refresh against the real server (selection kept, server loss, recovery)
        run: python -m pytest code/backend/tests/test_frontend.py -v

  browser:
    name: Dashboard in real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informational: this scenario passes in jsdom in the frontend job; this adds a real browser.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium

      - name: Live refresh in Chromium
        run: python frontend/test/browser_live.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshot
          path: runs/frontend_live.png
          if-no-files-found: ignore

  smoke:
    name: Scripted end-to-end run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e .

      - name: Eval, evolve, verify, report
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/meta.json" <<'JSON'
          [
            {"tool_calls": [{"name": "write_file", "arguments": {"path": "genome/prompts.py", "content": "SYSTEM_PROMPT = 'You are a careful engineer. Verify, then call finish.'\n"}}]},
            {"tool_calls": [{"name": "run_python", "arguments": {"args": ["-c", "import genome; print(genome.solve)"]}}]},
            {"tool_calls": [{"name": "finish", "arguments": {"summary": "tightened the prompt"}}]}
          ]
          JSON
          solve="scripted:$GITHUB_WORKSPACE/infrastructure/smoke/solve.json"
          singularis eval --llm "$solve" --only fizzbuzz --out "$RUNNER_TEMP/eval" | tee "$RUNNER_TEMP/eval.txt"
          grep -Eq "^fizzbuzz +1\.00" "$RUNNER_TEMP/eval.txt"
          singularis evolve --llm "$solve" --meta-llm "scripted:$RUNNER_TEMP/meta.json" \
            --root "$RUNNER_TEMP/exp" --iterations 2 --meta-evolve-every 1
          singularis verify --root "$RUNNER_TEMP/exp"
          singularis report --root "$RUNNER_TEMP/exp"
          test -s "$RUNNER_TEMP/exp/report.json"

      - name: Live dashboard server
        run: |
          set -euo pipefail
          singularis serve --root "$RUNNER_TEMP/exp" --port 18765 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 40); do
            curl -fs http://127.0.0.1:18765/healthz >/dev/null && break
            sleep 0.5
          done
          curl -fs http://127.0.0.1:18765/report.json | python -c "import json, sys; d = json.load(sys.stdin); assert len(d['agents']) >= 3, d['agents']; print('live report agents:', len(d['agents']))"
          page="$(curl -fs http://127.0.0.1:18765/)"
          grep -q "Singularis" <<< "$page"

  proxy-policy:
    name: Egress allowlist (real squid)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install squid and start it with the repository config
        run: |
          set -euo pipefail
          python -m pip install -e .
          sudo apt-get update -q
          sudo apt-get install -y -q squid
          sudo systemctl stop squid || true
          sed 's/^http_port 3128/http_port 127.0.0.1:13128/' infrastructure/squid.conf > "$RUNNER_TEMP/squid.conf"
          sudo sh -c 'exec squid -N -f "$1" > "$2" 2>&1' sh "$RUNNER_TEMP/squid.conf" "$RUNNER_TEMP/squid.out" &
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/13128) 2>/dev/null && break
            sleep 0.5
          done
          (echo > /dev/tcp/127.0.0.1/13128)

      - name: Probe allowed and blocked destinations
        run: |
          set -euo pipefail
          proxy="http://127.0.0.1:13128"
          probe() { curl -sS -m 20 -x "$proxy" -o /dev/null "$1" || true; }
          probe https://api.anthropic.com/
          probe https://example.com/
          probe http://example.com/
          probe https://api.anthropic.com.attacker.test/
          probe https://api.anthropic.com:8443/
          sudo cat /var/log/squid/access.log
          sudo grep -Eq "TCP_TUNNEL/200 [0-9]+ CONNECT api[.]anthropic[.]com:443 " /var/log/squid/access.log
          for target in example.com:443 api.anthropic.com.attacker.test:443 api.anthropic.com:8443; do
            sudo grep -Eq "TCP_DENIED[A-Z_]*/403 [0-9]+ CONNECT ${target//./[.]} " /var/log/squid/access.log
          done
          sudo grep -Eq "TCP_DENIED[A-Z_]*/403 [0-9]+ GET http://example[.]com/ " /var/log/squid/access.log

      - name: The isolation checker agrees
        run: |
          python - <<'PY'
          from backend.core.isolation import check_proxy_policy

          checks = check_proxy_policy("http://127.0.0.1:13128")
          for check in checks:
              print("ok  " if check.ok else "FAIL", check.name, "-", check.detail)
          assert checks and all(check.ok for check in checks)
          PY

      - name: Squid output
        if: failure()
        run: cat "$RUNNER_TEMP/squid.out"

  docker-stack:
    name: Container stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify isolation from inside the container
        env:
          ANTHROPIC_API_KEY: ""
        run: bash scripts/verify_docker.sh

      - name: Container logs
        if: failure()
        env:
          ANTHROPIC_API_KEY: ""
          LOCAL_UID: "1000"
          LOCAL_GID: "1000"
        run: docker compose -f infrastructure/docker-compose.yml logs --no-color

      - name: Clean up
        if: always()
        env:
          ANTHROPIC_API_KEY: ""
          LOCAL_UID: "1000"
          LOCAL_GID: "1000"
        run: docker compose -f infrastructure/docker-compose.yml down -v --remove-orphans

  build:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = [
              "ai_models/llm.py",
              "ai_models/genome/__init__.py",
              "ai_models/genome/agent.py",
              "ai_models/genome/tools.py",
              "ai_models/genome/prompts.py",
              "backend/cli.py",
              "backend/evaluation/suite_issues.py",
              "backend/evaluation/swebench.py",
              "backend/evolution/evolve.py",
          ]
          missing = [name for name in required if name not in names]
          assert not missing, f"missing from the wheel: {missing}"
          print("wheel contains", len(names), "files")
          PY

      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/pip" install -q dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheelenv/bin/singularis" validate-suite

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational: code scanning needs GitHub Advanced Security on private repositories.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  audit:
    name: Dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit installed dependencies
        run: |
          python -m pip install -e ".[anthropic,dev]" pip-audit
          pip-audit --skip-editable

  ci-passed:
    name: CI passed
    if: always()
    needs: [static, test, frontend, smoke, proxy-policy, docker-stack, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed"
              exit 1
            fi
          done

  live-baseline:
    name: Live model baseline
    if: github.event_name == 'workflow_dispatch' && inputs.live_baseline
    needs: [ci-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: live-model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[anthropic]"

      - name: Score the seed genome on a few tasks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVE_MODEL: ${{ inputs.live_model }}
          LIVE_TASKS: ${{ inputs.live_tasks }}
        run: |
          set -euo pipefail
          singularis eval --llm "$LIVE_MODEL" --only "$LIVE_TASKS" \
            --max-steps 30 --max-tokens 150000 --timeout 600 --workers 2 \
            --out "$RUNNER_TEMP/live" | tee "$RUNNER_TEMP/live-baseline.txt"

      - name: Upload results and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-baseline
          path: |
            ${{ runner.temp }}/live-baseline.txt
            ${{ runner.temp }}/live/traces
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci-passed, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the package version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          with open("pyproject.toml", "rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]
          source = open("code/backend/__init__.py").read()
          module_version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          assert project_version == module_version, (project_version, module_version)
          assert tag == f"v{project_version}", f"tag {tag} does not match version {project_version}"
          print("releasing", tag)
          PY

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  docker-publish:
    name: Publish container image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci-passed, docker-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
