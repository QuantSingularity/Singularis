# Egress allowlist: HTTPS CONNECT to api.anthropic.com:443 and nothing else.
http_port 3128

acl allowed_domains dstdomain api.anthropic.com
acl ssl_ports port 443
acl connect_method method CONNECT

http_access allow connect_method allowed_domains ssl_ports
http_access deny all

cache deny all
via off
forwarded_for delete
