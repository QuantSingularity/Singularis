name: singularis

services:
  singularis:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_KEY_FILE: ${ANTHROPIC_API_KEY_FILE:-}
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
    networks: [sandbox]
    depends_on: [egress-proxy]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 8g
    cpus: 4
    volumes:
      - ../runs:/app/runs

  egress-proxy:
    image: ubuntu/squid:latest
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks: [sandbox, egress]

networks:
  sandbox:
    internal: true
  egress: {}
